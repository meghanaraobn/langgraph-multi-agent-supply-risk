[project]
name = "langgraph-multi-agent-supply-risk"
version = "0.1.0"
description = "Multi-agent supply chain risk investigation system built with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Meghana Rao", email = "meghana.rao@twoimpulse.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pdfplumber>=0.11.0",
    "sentence-transformers>=3.3.0",
    "weaviate-client>=4.9.0",
    "langchain-text-splitters>=0.3.0",
    "nltk>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "reportlab>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supplyguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: exercises the real graph against the real Azure-hosted LLM (real cost/latency). Excluded by default; run explicitly with `pytest -m live`.",
    "integration: exercises a real external service (Weaviate) rather than a mock. Excluded by default; run explicitly with `pytest -m integration` after `docker compose up -d weaviate`.",
]
addopts = "-m 'not live and not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
